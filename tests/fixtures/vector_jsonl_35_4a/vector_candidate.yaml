{
  "data_dir": "/run/vector-pilot/state",
  "api": {"enabled": false},
  "sources": {
    "synthetic_file": {
      "type": "file",
      "include": ["/run/vector-pilot/input.log"],
      "read_from": "beginning",
      "max_line_bytes": 8192,
      "file_key": "",
      "host_key": ""
    }
  },
  "transforms": {
    "adapter_envelope": {
      "type": "remap",
      "inputs": ["synthetic_file"],
      "source": ". = {\"schema_version\": 1, \"source_role\": \"application\", \"payload\": string!(.message), \"collector_instance_alias\": \"vector-pilot\", \"sequence_hint\": null, \"retry_hint\": false}"
    }
  },
  "sinks": {
    "jsonl_adapter": {
      "type": "socket",
      "inputs": ["adapter_envelope"],
      "mode": "tcp",
      "address": "127.0.0.1:39091",
      "healthcheck": {"enabled": false},
      "framing": {"method": "newline_delimited"},
      "encoding": {"codec": "json"},
      "buffer": {"type": "memory", "max_events": 128, "when_full": "block"},
      "acknowledgements": {"enabled": true}
    }
  }
}
