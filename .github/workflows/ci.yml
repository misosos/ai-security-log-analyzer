name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Locked Python 3.12 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          python-version: "3.12.7"
          enable-cache: false

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --dev --locked --no-build

      - name: Compile Python sources and tests
        run: uv run python -m compileall -q app tests main.py

      - name: Verify Linux checkpoint reset and process restart
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_checkpoint_epoch_reset.py tests/test_monitor_setup_runtime.py::test_two_reset_processes_do_not_share_approval_lock tests/test_monitor_setup_runtime.py::test_cli_explicit_checkpoint_reset_starts_a_new_epoch

      - name: Verify Linux SSH checkpoint recovery and process ownership
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_ssh_checkpoint_26_0.py
          uv run python tests/smoke_ssh_checkpoint_26_0.py

      - name: Verify Linux unified application and SSH setup management
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_monitor_setup_unified_30_2.py tests/test_monitor_setup_management.py tests/test_checkpoint_epoch_reset.py
          uv run python tests/smoke_unified_monitor_management_30_2.py

      - name: Verify bounded OpenAPI property pilot
        run: uv run pytest -q tests/test_schemathesis_api_pilot_23_5.py

      - name: Run complete regression
        run: uv run pytest -q

      - name: Install pinned Node for development-only accessibility checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.10.0"
          package-manager-cache: false

      - name: Install locked Node test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Chromium headless shell only
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: ./node_modules/.bin/playwright install chromium --only-shell

      - name: Verify browser and FFmpeg executable hashes
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          printf '%s  %s\n' '2b1a87b7d808c989193887d24c2e7cfc74fc775629443eda629b72687585b95423f85ac180209d95ff3b562805c26a8b63afabb068dfa92b715da1246c0426b8' "$PLAYWRIGHT_BROWSERS_PATH/chromium_headless_shell-1248/chrome-headless-shell-linux64/chrome-headless-shell" | sha512sum --check --status
          printf '%s  %s\n' '7d5a4bd12741d3a62137f7702a5c754aad7ce24df2e3ca2e6af3cff67e2a59424d497353e6e8989d544b5a5f3d3213c0dcc0cab74bae89a0ef3f3cf2fb365217' "$PLAYWRIGHT_BROWSERS_PATH/ffmpeg-1013/ffmpeg-linux" | sha512sum --check --status

      - name: Run bounded Chromium accessibility pilot
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          TZ: UTC
        run: npm run test:a11y --silent

      - name: Verify tests did not modify tracked files
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
