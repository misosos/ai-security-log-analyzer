# Reference include for the nginx http context. Target: nginx 1.24 or newer.
# The access format deliberately omits headers, query strings, and request bodies.
log_format linux_audit_access
    '$request_id [$time_iso8601] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

# These endpoint-global zones are local to this nginx instance.
limit_req_zone $server_name zone=linux_audit_rate:1m rate=6r/m;
limit_conn_zone $server_name zone=linux_audit_connections:1m;

# Reject unknown SNI/Host traffic rather than using the API virtual host.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name linux-audit-api.example.invalid;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/linux-audit-api.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/linux-audit-api.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/linux-audit-api-access.log linux_audit_access;
    error_log /var/log/nginx/linux-audit-api-error.log warn;

    client_max_body_size 24m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 413 = @edge_body_too_large;
    error_page 429 = @edge_rate_limited;
    error_page 405 = @method_not_allowed;

    add_header Cache-Control "no-store" always;

    location = /api/analyze-linux-audit {
        if ($request_method != POST) {
            return 405;
        }

        limit_req zone=linux_audit_rate burst=2 nodelay;
        limit_conn linux_audit_connections 4;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;

        proxy_set_header Host linux-audit-api.example.invalid;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host linux-audit-api.example.invalid;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
    }

    location @edge_body_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"EDGE_REQUEST_BODY_TOO_LARGE","message":"Request body exceeds the deployment limit."}}';
    }

    location @edge_rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"EDGE_REQUEST_RATE_LIMITED","message":"Request rate is currently limited."}}';
    }

    location @method_not_allowed {
        default_type application/json;
        return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"Method is not allowed."}}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Resource not found."}}';
    }
}
